name: Radar de Investimentos

on:
  schedule:
    # Horários em UTC. Equivalem a 7h, 10h, 13h, 16h e 19h em Brasília.
    - cron: "0 10,13,16,19,22 * * *"
    # Resumo semanal: segunda-feira às 8h (Brasília).
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      modo:
        description: "O que executar"
        type: choice
        default: busca
        options: [busca, email-teste, resumo-semanal]
      dias:
        description: "Buscar notícias de quantos dias para trás (use 365 na primeira vez)"
        default: "15"

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Executar radar
        env:
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORTA: ${{ secrets.SMTP_PORTA }}
          EMAIL_DESTINATARIOS: ${{ secrets.EMAIL_DESTINATARIOS }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIAS_RETROATIVOS: ${{ github.event.inputs.dias }}
          MAX_ARTIGOS: ${{ github.event.inputs.dias && '400' || '' }}
          PAINEL_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          [ -z "$SMTP_HOST" ] && unset SMTP_HOST
          [ -z "$SMTP_PORTA" ] && unset SMTP_PORTA
          MODO="${{ github.event.inputs.modo }}"
          if [ "$MODO" = "email-teste" ]; then
            python robo/radar.py --email-teste
          elif [ "$MODO" = "resumo-semanal" ] || [ "${{ github.event.schedule }}" = "0 11 * * 1" ]; then
            python robo/radar.py --resumo-semanal
          else
            python robo/radar.py
          fi

      - name: Salvar histórico (alimenta o painel)
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/data data
          git diff --cached --quiet || git commit -m "Radar: atualização $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
